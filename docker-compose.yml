services:
  postgres:
    image: postgres:16-alpine
    container_name: blogops-postgres
    restart: always
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
      POSTGRES_DB: blogdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogops-app
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      DATABASE_URL: postgres://bloguser:blogpass@postgres:5432/blogdb
      JWT_SECRET: super_secret_jwt_key_2026
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: blogops-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - blog-app

  grafana:
    image: grafana/grafana:latest
    container_name: blogops-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata:
